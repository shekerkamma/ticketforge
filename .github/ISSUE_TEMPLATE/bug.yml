name: Bug report
description: Report a bug in a way Codex can act on directly.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken? Be concrete.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Give the shortest reliable path to reproduce it.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Relevant files or areas
      description: If known, list files, routes, services, or screens involved.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should we know this is fixed?
      placeholder: Test, manual path, or observable output.
